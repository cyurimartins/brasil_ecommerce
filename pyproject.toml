[project]
name = "brasil-ecommerce"
version = "0.1.0"
description = "Pipeline de dados analítico do e-commerce brasileiro (Olist): DuckDB, dbt e Dagster."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Yuri Martins" }]
dependencies = [
    "dagster>=1.13.29",
    "dagster-dbt>=0.29.29",
    "dbt-core>=1.12.6",
    "dbt-duckdb>=1.11.1",
    "duckdb>=2.0.0",
    "kagglehub>=1.0.3",
    "pandas>=3.1.1",
    "plotly>=7.1.0",
    "pydantic-settings>=2.6",
    "streamlit>=1.67.0",
]

[project.scripts]
brecom-ingest = "brasil_ecommerce.ingestion.__main__:main"

[dependency-groups]
dev = [
    "dagster-webserver>=1.13.29",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "ruff>=0.8",
    "sqlfluff>=4.5.0",
    "sqlfluff-templater-dbt>=4.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brasil_ecommerce"]

# ---------------------------------------------------------------------------
# Ruff — lint + formatação
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# Tipografia intencional em textos exibidos no dashboard.
allowed-confusables = ["×", "–"]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "N",        # pep8-naming
    "PTH",      # usar pathlib
    "RUF",      # regras do próprio ruff
]


# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    # Dependência indireta do dbt; não é código do projeto.
    "ignore:sqlglotrs is deprecated:DeprecationWarning",
]
