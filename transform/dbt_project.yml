name: brasil_ecommerce
version: "0.1.0"
config-version: 2
profile: brasil_ecommerce

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]

clean-targets: ["target", "dbt_packages"]

vars:
  # Horário de referência dos timestamps da Olist (sem fuso na origem).
  source_timezone: "America/Sao_Paulo"

models:
  brasil_ecommerce:
    +persist_docs:
      relation: true
      columns: true
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: view
    marts:
      +schema: marts
      +materialized: table

tests:
  brasil_ecommerce:
    +severity: error
